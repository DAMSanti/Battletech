; Export presets adicional para servidor Linux dedicado
; Añadir al final de export_presets.cfg o usar este archivo separado

[preset.server]

name="Linux Server"
platform="Linux"
runnable=false
dedicated_server=true
custom_features="dedicated_server"
export_filter="all_resources"
include_filter="*.gd,*.tscn,*.tres"
exclude_filter="*.svg,*.png,*.wav,*.ogg,*.mp3"
export_path="./exports/BattleTech_Server.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.server.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=false
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
