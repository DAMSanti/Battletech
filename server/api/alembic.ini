# Alembic configuration file for Steel Titans API

[alembic]
# Path to migration scripts
script_location = alembic

# Database URL - will be overridden by env.py
# sqlalchemy.url = driver://user:pass@localhost/dbname

# Prepend sys.path for model imports
prepend_sys_path = .

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate revision to allow multiple revisions same minute
truncate_slug_length = 40

# Set to 'true' to run offline mode
# offline = false

# Timezone to use when rendering the date
timezone = UTC

[post_write_hooks]
# Hooks after generating migrations (optional)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
