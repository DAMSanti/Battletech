    <circle cx="35" cy="86" r="4" fill="#353535" stroke="#202020" stroke-width="1"/>
    
    <!-- Upper leg -->
    <rect x="30" y="87" width="10" height="20" rx="1.5" fill="#404040" stroke="#202020" stroke-width="1"/>
    
    <!-- Knee joint -->
    <circle cx="35" cy="108" r="3.5" fill="#353535" stroke="#202020" stroke-width="1"/>
    
    <!-- Lower leg -->
    <path d="M 31 109 L 31 125 L 28 130 L 28 135 L 42 135 L 42 130 L 39 125 L 39 109 Z" 
          fill="#404040" stroke="#202020" stroke-width="1"/>
    
    <!-- Actuators -->
    <circle cx="35" cy="95" r="1.5" fill="#303030"/>
    <circle cx="35" cy="100" r="1.5" fill="#303030"/>
    <circle cx="35" cy="117" r="1.5" fill="#303030"/>
    <circle cx="35" cy="125" r="1.5" fill="#303030"/>
  </g>
