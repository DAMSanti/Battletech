    <rect x="35" y="48" width="30" height="40" rx="3" fill="#00FF00" fill-opacity="0.8" stroke="#00AA00" stroke-width="2"/>
    
    <!-- Central ridge -->
    <rect x="48" y="52" width="4" height="32" rx="1" fill="#00CC00" fill-opacity="0.7"/>
    
    <!-- Armor panels -->
    <path d="M 38 55 L 42 58 L 42 75 L 38 78 Z" fill="#00DD00" fill-opacity="0.6"/>
    <path d="M 62 55 L 58 58 L 58 75 L 62 78 Z" fill="#00DD00" fill-opacity="0.6"/>
    
    <!-- Vent slits -->
    <line x1="40" y1="70" x2="45" y2="70" stroke="#004400" stroke-width="1"/>
    <line x1="40" y1="73" x2="45" y2="73" stroke="#004400" stroke-width="1"/>
    <line x1="55" y1="70" x2="60" y2="70" stroke="#004400" stroke-width="1"/>
    <line x1="55" y1="73" x2="60" y2="73" stroke="#004400" stroke-width="1"/>
