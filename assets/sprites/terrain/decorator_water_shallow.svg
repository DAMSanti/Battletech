<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Shallow Water - Gentle ripples -->
  <defs>
    <linearGradient id="rippleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <!-- Ripple lines -->
  <ellipse cx="48" cy="30" rx="30" ry="6" fill="none" stroke="url(#rippleGrad)" stroke-width="2" opacity="0.5"/>
  <ellipse cx="48" cy="48" rx="35" ry="7" fill="none" stroke="url(#rippleGrad)" stroke-width="2" opacity="0.4"/>
  <ellipse cx="48" cy="66" rx="28" ry="5" fill="none" stroke="url(#rippleGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Light reflections -->
  <ellipse cx="30" cy="40" rx="8" ry="3" fill="#FFFFFF" opacity="0.2"/>
  <ellipse cx="65" cy="55" rx="6" ry="2" fill="#FFFFFF" opacity="0.15"/>
  <ellipse cx="45" cy="75" rx="5" ry="2" fill="#FFFFFF" opacity="0.18"/>
</svg>
