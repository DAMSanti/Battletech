<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Building rooftop details -->
  <defs>
    <linearGradient id="ventGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7A7A7A"/>
      <stop offset="100%" style="stop-color:#5A5A5A"/>
    </linearGradient>
  </defs>
  
  <!-- Rooftop edge highlight -->
  <rect x="5" y="5" width="86" height="3" fill="#8A8A8A" opacity="0.4"/>
  <rect x="5" y="88" width="86" height="3" fill="#4A4A4A" opacity="0.4"/>
  <rect x="5" y="5" width="3" height="86" fill="#6A6A6A" opacity="0.3"/>
  <rect x="88" y="5" width="3" height="86" fill="#6A6A6A" opacity="0.3"/>
  
  <!-- AC unit / vent 1 -->
  <rect x="15" y="20" width="20" height="15" rx="2" fill="url(#ventGrad)" opacity="0.7"/>
  <rect x="18" y="23" width="14" height="3" fill="#3A3A3A" opacity="0.5"/>
  <rect x="18" y="28" width="14" height="3" fill="#3A3A3A" opacity="0.5"/>
  
  <!-- AC unit / vent 2 -->
  <rect x="60" y="55" width="18" height="12" rx="2" fill="url(#ventGrad)" opacity="0.65"/>
  <rect x="62" y="58" width="14" height="2" fill="#3A3A3A" opacity="0.5"/>
  <rect x="62" y="62" width="14" height="2" fill="#3A3A3A" opacity="0.5"/>
  
  <!-- Pipes -->
  <rect x="50" y="15" width="4" height="25" rx="2" fill="#6A6A6A" opacity="0.6"/>
  <rect x="48" y="38" width="8" height="4" rx="1" fill="#5A5A5A" opacity="0.5"/>
  
  <!-- Skylight -->
  <rect x="20" y="55" width="15" height="20" rx="1" fill="#4A6A8A" opacity="0.4"/>
  <line x1="27" y1="55" x2="27" y2="75" stroke="#3A3A3A" stroke-width="1" opacity="0.5"/>
  <line x1="20" y1="65" x2="35" y2="65" stroke="#3A3A3A" stroke-width="1" opacity="0.5"/>
  
  <!-- Access hatch -->
  <rect x="70" y="25" width="12" height="12" fill="#5A5A5A" opacity="0.5"/>
  <rect x="72" y="27" width="8" height="8" fill="#4A4A4A" opacity="0.6"/>
</svg>
