<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Deep Water - More pronounced waves -->
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#FFFFFF;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.7"/>
      <stop offset="70%" style="stop-color:#FFFFFF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="depthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000030;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000030;stop-opacity:0.3"/>
    </linearGradient>
  </defs>
  
  <!-- Depth darkening -->
  <rect x="0" y="0" width="96" height="96" fill="url(#depthGrad)" opacity="0.5"/>
  
  <!-- Wave lines (more pronounced) -->
  <path d="M 5,25 Q 25,20 48,25 Q 70,30 90,25" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.6"/>
  <path d="M 10,45 Q 30,38 48,45 Q 68,52 88,45" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.55"/>
  <path d="M 5,65 Q 28,60 48,65 Q 72,70 92,65" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.5"/>
  
  <!-- Foam/highlights -->
  <ellipse cx="25" cy="35" rx="10" ry="3" fill="#FFFFFF" opacity="0.25"/>
  <ellipse cx="70" cy="50" rx="8" ry="2.5" fill="#FFFFFF" opacity="0.2"/>
  <ellipse cx="40" cy="72" rx="7" ry="2" fill="#FFFFFF" opacity="0.22"/>
</svg>
