<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Light Woods - 2-3 scattered small trees -->
  <defs>
    <linearGradient id="treeGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D5A27"/>
      <stop offset="100%" style="stop-color:#1A3A18"/>
    </linearGradient>
  </defs>
  
  <!-- Tree 1 (left) -->
  <g transform="translate(20, 55)">
    <!-- Trunk -->
    <rect x="8" y="20" width="4" height="12" fill="#4A3728"/>
    <!-- Foliage layers -->
    <ellipse cx="10" cy="12" rx="14" ry="10" fill="url(#treeGrad1)" opacity="0.85"/>
    <ellipse cx="10" cy="8" rx="10" ry="7" fill="#3D7A35" opacity="0.9"/>
  </g>
  
  <!-- Tree 2 (right) -->
  <g transform="translate(55, 45)">
    <rect x="7" y="18" width="3" height="10" fill="#5C4433"/>
    <ellipse cx="8" cy="10" rx="12" ry="9" fill="url(#treeGrad1)" opacity="0.8"/>
    <ellipse cx="8" cy="6" rx="8" ry="6" fill="#4A8A42" opacity="0.85"/>
  </g>
  
  <!-- Small bush/shrub -->
  <ellipse cx="45" cy="75" rx="8" ry="5" fill="#2D5A27" opacity="0.6"/>
</svg>
