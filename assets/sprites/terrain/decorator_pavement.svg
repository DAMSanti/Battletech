<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Pavement - Cracks and road markings -->
  
  <!-- Main crack pattern -->
  <path d="M 20,10 L 25,30 L 22,50 L 28,70 L 24,90" 
        fill="none" stroke="#3A3A3A" stroke-width="2" opacity="0.6"/>
  <path d="M 25,30 L 45,35 L 55,32" 
        fill="none" stroke="#3A3A3A" stroke-width="1.5" opacity="0.5"/>
  <path d="M 22,50 L 40,55 L 60,48" 
        fill="none" stroke="#3A3A3A" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Secondary cracks -->
  <path d="M 70,15 L 68,35 L 72,60 L 65,85" 
        fill="none" stroke="#4A4A4A" stroke-width="1" opacity="0.4"/>
  
  <!-- Wear marks -->
  <ellipse cx="45" cy="45" rx="15" ry="8" fill="#5A5A5A" opacity="0.15"/>
  <ellipse cx="55" cy="70" rx="12" ry="6" fill="#4A4A4A" opacity="0.12"/>
  
  <!-- Oil stain -->
  <ellipse cx="70" cy="50" rx="8" ry="10" fill="#2A2A2A" opacity="0.2"/>
  
  <!-- Small debris/gravel -->
  <circle cx="30" cy="80" r="1.5" fill="#6A6A6A" opacity="0.4"/>
  <circle cx="80" cy="25" r="1" fill="#5A5A5A" opacity="0.35"/>
  <circle cx="15" cy="60" r="1.2" fill="#7A7A7A" opacity="0.3"/>
</svg>
