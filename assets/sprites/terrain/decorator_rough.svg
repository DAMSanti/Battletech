<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Rough terrain - Scattered rocks and uneven ground -->
  <defs>
    <linearGradient id="rockGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8A8A8A"/>
      <stop offset="50%" style="stop-color:#6A6A6A"/>
      <stop offset="100%" style="stop-color:#4A4A4A"/>
    </linearGradient>
    <linearGradient id="rockGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7A7A7A"/>
      <stop offset="100%" style="stop-color:#5A5A5A"/>
    </linearGradient>
  </defs>
  
  <!-- Large rock cluster (center-left) -->
  <polygon points="20,60 35,45 50,55 45,70 25,72" fill="url(#rockGrad1)" opacity="0.9"/>
  <polygon points="35,45 45,40 50,55" fill="#9A9A9A" opacity="0.7"/>
  
  <!-- Medium rock (right) -->
  <polygon points="60,50 75,45 80,60 70,68 58,62" fill="url(#rockGrad2)" opacity="0.85"/>
  <polygon points="60,50 75,45 70,55" fill="#8A8A8A" opacity="0.6"/>
  
  <!-- Small rocks scattered -->
  <ellipse cx="30" cy="80" rx="8" ry="5" fill="#6A6A6A" opacity="0.7"/>
  <ellipse cx="70" cy="75" rx="6" ry="4" fill="#7A7A7A" opacity="0.65"/>
  <ellipse cx="50" cy="35" rx="5" ry="3" fill="#5A5A5A" opacity="0.6"/>
  
  <!-- Pebbles -->
  <circle cx="15" cy="45" r="3" fill="#8A8A8A" opacity="0.5"/>
  <circle cx="85" cy="40" r="2" fill="#7A7A7A" opacity="0.5"/>
  <circle cx="40" cy="85" r="2.5" fill="#6A6A6A" opacity="0.5"/>
</svg>
