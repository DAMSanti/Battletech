<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Explosion effect for ammo explosion -->
  <defs>
    <radialGradient id="explosionCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#FFFF00;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FF6600;stop-opacity:0.9"/>
      <stop offset="80%" style="stop-color:#FF0000;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#330000;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="explosionOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FF6600;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#FF3300;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer explosion ring -->
  <ellipse cx="64" cy="64" rx="60" ry="55" fill="url(#explosionOuter)"/>
  
  <!-- Explosion spikes -->
  <polygon points="64,4 70,35 64,25 58,35" fill="#FF6600" opacity="0.8"/>
  <polygon points="64,124 70,93 64,103 58,93" fill="#FF6600" opacity="0.8"/>
  <polygon points="4,64 35,58 25,64 35,70" fill="#FF6600" opacity="0.8"/>
  <polygon points="124,64 93,58 103,64 93,70" fill="#FF6600" opacity="0.8"/>
  
  <!-- Diagonal spikes -->
  <polygon points="20,20 45,40 35,35 40,45" fill="#FF9900" opacity="0.7"/>
  <polygon points="108,20 83,40 93,35 88,45" fill="#FF9900" opacity="0.7"/>
  <polygon points="20,108 45,88 35,93 40,83" fill="#FF9900" opacity="0.7"/>
  <polygon points="108,108 83,88 93,93 88,83" fill="#FF9900" opacity="0.7"/>
  
  <!-- Core explosion -->
  <circle cx="64" cy="64" r="35" fill="url(#explosionCore)"/>
  
  <!-- Inner bright core -->
  <circle cx="64" cy="64" r="15" fill="#FFFFFF" opacity="0.9"/>
</svg>
