<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 24" width="64" height="24">
  <!-- PPC (Particle Projector Cannon) - blue lightning bolt -->
  <defs>
    <linearGradient id="ppcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0044FF;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#00AAFF;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#00AAFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0044FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="ppcGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Electric arcs -->
  <polyline points="4,12 12,8 20,16 28,6 36,18 44,10 52,14 60,12" 
            stroke="#00AAFF" stroke-width="3" fill="none" opacity="0.5" filter="url(#ppcGlow)"/>
  <polyline points="4,12 14,14 22,8 30,16 38,10 46,14 54,8 60,12" 
            stroke="#00DDFF" stroke-width="2" fill="none" opacity="0.7"/>
  <!-- Main bolt core -->
  <ellipse cx="32" cy="12" rx="28" ry="4" fill="url(#ppcGrad)" filter="url(#ppcGlow)"/>
  <!-- Bright center -->
  <ellipse cx="32" cy="12" rx="20" ry="2" fill="#FFFFFF" opacity="0.9"/>
</svg>
