<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 12" width="48" height="12">
  <!-- Ballistic projectile - AC rounds, machine gun -->
  <defs>
    <linearGradient id="bulletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#444444;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#888888;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#CCCCCC;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="tracerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8800;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFAA00;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFFF00;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Tracer trail -->
  <ellipse cx="20" cy="6" rx="18" ry="3" fill="url(#tracerGrad)"/>
  <!-- Bullet -->
  <ellipse cx="38" cy="6" rx="8" ry="4" fill="url(#bulletGrad)"/>
  <!-- Highlight -->
  <ellipse cx="40" cy="4" rx="4" ry="2" fill="#FFFFFF" opacity="0.4"/>
  <!-- Muzzle flash hint -->
  <circle cx="6" cy="6" r="4" fill="#FFAA00" opacity="0.5"/>
</svg>
