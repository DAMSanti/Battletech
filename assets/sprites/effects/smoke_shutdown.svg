<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Smoke effect for mech shutdown -->
  <defs>
    <radialGradient id="smokeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#888888;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#666666;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#444444;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Multiple smoke puffs -->
  <ellipse cx="32" cy="48" rx="20" ry="12" fill="url(#smokeGrad)"/>
  <ellipse cx="24" cy="38" rx="16" ry="10" fill="url(#smokeGrad)"/>
  <ellipse cx="40" cy="36" rx="14" ry="9" fill="url(#smokeGrad)"/>
  <ellipse cx="32" cy="28" rx="18" ry="11" fill="url(#smokeGrad)"/>
  <ellipse cx="26" cy="20" rx="12" ry="8" fill="url(#smokeGrad)"/>
  <ellipse cx="38" cy="18" rx="10" ry="7" fill="url(#smokeGrad)"/>
  <ellipse cx="32" cy="12" rx="8" ry="6" fill="url(#smokeGrad)"/>
</svg>
