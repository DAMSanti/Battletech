<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 20" width="56" height="20">
  <!-- Missile with smoke trail -->
  <defs>
    <linearGradient id="missileBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#666666"/>
      <stop offset="50%" style="stop-color:#999999"/>
      <stop offset="100%" style="stop-color:#CCCCCC"/>
    </linearGradient>
    <linearGradient id="exhaustGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#888888;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#AAAAAA;stop-opacity:0.6"/>
      <stop offset="60%" style="stop-color:#FF8800;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#FFFF00;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <!-- Smoke trail -->
  <ellipse cx="16" cy="10" rx="14" ry="5" fill="#888888" opacity="0.3"/>
  <ellipse cx="10" cy="10" rx="8" ry="4" fill="#AAAAAA" opacity="0.4"/>
  <!-- Exhaust flame -->
  <ellipse cx="28" cy="10" rx="10" ry="4" fill="url(#exhaustGrad)"/>
  <!-- Missile body -->
  <rect x="36" y="6" width="16" height="8" rx="2" fill="url(#missileBody)"/>
  <!-- Nose cone -->
  <polygon points="52,10 56,6 56,14" fill="#CC0000"/>
  <!-- Fins -->
  <polygon points="36,6 38,2 40,6" fill="#666666"/>
  <polygon points="36,14 38,18 40,14" fill="#666666"/>
  <!-- Warning stripe -->
  <rect x="42" y="6" width="2" height="8" fill="#FFCC00"/>
</svg>
