<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Miss effect - projectile whizzing past with motion blur -->
  <defs>
    <linearGradient id="missTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#888888;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#AAAAAA;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#CCCCCC;stop-opacity:0"/>
    </linearGradient>
    <filter id="motionBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2,0"/>
    </filter>
  </defs>
  <!-- Motion trails indicating projectile passing by -->
  <ellipse cx="32" cy="20" rx="28" ry="3" fill="url(#missTrail)" filter="url(#motionBlur)"/>
  <ellipse cx="32" cy="32" rx="30" ry="2" fill="url(#missTrail)" filter="url(#motionBlur)"/>
  <ellipse cx="32" cy="44" rx="26" ry="3" fill="url(#missTrail)" filter="url(#motionBlur)"/>
  <!-- Wind/dust particles disturbed -->
  <circle cx="12" cy="28" r="2" fill="#AAAAAA" opacity="0.5"/>
  <circle cx="20" cy="36" r="1.5" fill="#999999" opacity="0.4"/>
  <circle cx="44" cy="24" r="2" fill="#AAAAAA" opacity="0.5"/>
  <circle cx="52" cy="40" r="1.5" fill="#999999" opacity="0.4"/>
  <circle cx="8" cy="44" r="1" fill="#888888" opacity="0.3"/>
  <circle cx="56" cy="32" r="1" fill="#888888" opacity="0.3"/>
  <!-- Subtle "whoosh" lines -->
  <path d="M 4 26 Q 32 24 60 28" stroke="#CCCCCC" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M 4 38 Q 32 40 60 36" stroke="#CCCCCC" stroke-width="1" fill="none" opacity="0.3"/>
</svg>
